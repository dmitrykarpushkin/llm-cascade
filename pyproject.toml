[project]
name = "llm-cascade"
version = "0.1.0"
description = "Cost-aware LLM cascade: a cheap classifier prefilter, a small-model filter, a large-model writer, with batching and graceful fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cascade-decide = "llm_cascade.cli:decide_main"
cascade-digest = "llm_cascade.cli:digest_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cascade"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
